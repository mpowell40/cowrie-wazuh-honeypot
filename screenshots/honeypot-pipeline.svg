<svg viewBox="0 0 900 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <linearGradient id="honeypotGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="siemGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <rect width="900" height="1300" fill="#f8fafc"/>

  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">SSH Honeypot Detection Pipeline</text>
  <text x="450" y="70" text-anchor="middle" font-size="13" fill="#64748b">Adversary interaction events: capture → normalize → correlate → visualize</text>

  <!-- 1. Inbound Internet Traffic -->
  <rect x="300" y="100" width="300" height="60" rx="10" fill="#334155"/>
  <text x="450" y="126" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Inbound Internet Traffic</text>
  <text x="450" y="146" text-anchor="middle" font-size="11" fill="#cbd5e1">Untrusted / public-facing</text>
  <line x1="450" y1="160" x2="450" y2="195" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. iptables -->
  <rect x="280" y="200" width="340" height="60" rx="10" fill="#475569"/>
  <text x="450" y="226" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">iptables — Port Redirect</text>
  <text x="450" y="246" text-anchor="middle" font-size="11" fill="#cbd5e1">TCP 22 ➔ TCP 2222 (real SSH stays hidden)</text>
  <line x1="450" y1="260" x2="450" y2="295" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. Cowrie -->
  <rect x="260" y="300" width="380" height="70" rx="10" fill="url(#honeypotGrad)"/>
  <text x="450" y="330" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Cowrie Honeypot Sandbox</text>
  <text x="450" y="350" text-anchor="middle" font-size="11" fill="#e9d5ff">Emulated shell/filesystem · captures commands,</text>
  <text x="450" y="364" text-anchor="middle" font-size="11" fill="#e9d5ff">credentials, session I/O</text>
  <line x1="450" y1="370" x2="450" y2="405" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="392" font-size="11" fill="#64748b" font-style="italic">structured cowrie.json</text>

  <!-- 4. Wazuh Agent -->
  <rect x="280" y="410" width="340" height="60" rx="10" fill="#0f766e"/>
  <text x="450" y="436" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Wazuh Agent (Honeypot Node)</text>
  <text x="450" y="456" text-anchor="middle" font-size="11" fill="#ccfbf1">Tails cowrie.json, forwards events</text>
  <line x1="450" y1="470" x2="450" y2="510" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="495" font-size="11" fill="#64748b" font-style="italic" text-anchor="middle">encrypted mTLS</text>

  <!-- 5. Wazuh SIEM Cluster (container) -->
  <rect x="180" y="515" width="540" height="330" rx="14" fill="#e0f2fe" stroke="url(#siemGrad)" stroke-width="2"/>
  <text x="450" y="545" text-anchor="middle" font-size="16" font-weight="700" fill="#0c4a6e">Wazuh SIEM Cluster</text>

  <!-- sub: local_rules.xml -->
  <rect x="215" y="565" width="470" height="60" rx="8" fill="url(#siemGrad)"/>
  <text x="450" y="590" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">XML Detection Rules</text>
  <text x="450" y="608" text-anchor="middle" font-size="11" fill="#dbeafe">local_rules.xml — custom Cowrie event correlation</text>
  <line x1="450" y1="625" x2="450" y2="650" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- sub: GeoIP -->
  <rect x="215" y="655" width="470" height="60" rx="8" fill="url(#siemGrad)"/>
  <text x="450" y="680" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">MaxMind GeoIP Enrichment</text>
  <text x="450" y="698" text-anchor="middle" font-size="11" fill="#dbeafe">Attributes source IPs to geographic origin</text>
  <line x1="450" y1="715" x2="450" y2="740" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- sub: MITRE -->
  <rect x="215" y="745" width="470" height="60" rx="8" fill="url(#siemGrad)"/>
  <text x="450" y="770" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">MITRE ATT&amp;CK Tagging</text>
  <text x="450" y="788" text-anchor="middle" font-size="11" fill="#dbeafe">Maps alerts to adversary tactics &amp; techniques</text>

  <line x1="450" y1="845" x2="450" y2="880" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 6. OpenSearch Dashboards -->
  <rect x="250" y="885" width="400" height="70" rx="10" fill="#b45309"/>
  <text x="450" y="915" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">OpenSearch Dashboards</text>
  <text x="450" y="936" text-anchor="middle" font-size="11" fill="#fef3c7">Visualizations, alert triage, ATT&amp;CK heatmaps</text>

</svg>
